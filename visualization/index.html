<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIT Φ Visualization</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/gh/spite/THREE.MeshLine/src/THREE.MeshLine.js"></script> -->
    <title>Test</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>IIT Φ Visualization</h1>
            <p>Integrated Information Theory - Neural Network TPM Analysis</p>
        </div>

        <div class="main-content">
            <div class="visualization-container">
                <div id="canvas-container"></div>

                <div class="controls-overlay">
                    <div class="button-group">
                        <button id="startBtn" class="btn-start">Start</button>
                        <button id="stopBtn" class="btn-stop" disabled>Stop</button>
                        <button id="resetBtn" class="btn-reset">Reset</button>
                    </div>
                    <div class="epoch-display">
                        <span class="label">Epoch:</span>
                        <span class="value" id="epochValue">0</span>
                    </div>
                </div>

                <div class="info-overlay">
                    <div class="info-row">
                        <span class="label">Architecture:</span>
                        <span class="value" id="architecture">3-4-2</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Status:</span>
                        <span class="value status-stopped" id="status">Stopped</span>
                    </div>
                </div>
            </div>

            <div class="tpm-panel">
                <div class="tpm-header">
                    <h2>Transition Probability Matrix</h2>
                    <p>Real-time TPM updates per epoch</p>
                </div>
                <div class="tpm-content">
                    <div id="tpmMatrix" class="tpm-matrix"></div>
                    <div id="emptyState" class="empty-state">Start simulation to see TPM updates</div>
                </div>
                <div class="tpm-footer">
                    <div class="legend-item">
                        <div class="legend-color legend-low"></div>
                        <span>Low probability</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color legend-high"></div>
                        <span>High probability</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Module scripts -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/state.js"></script>
    <script type="module" src="js/tpm.js"></script>
    <script type="module" src="js/scene.js"></script>
    <script type="module" src="js/network.js"></script>
    <script type="module" src="js/controls.js"></script>
    <script type="module" src="js/animation.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
